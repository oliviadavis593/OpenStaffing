services:
  db:
    image: postgis/postgis:16-3.4
    container_name: openstaffing-db
    environment:
      POSTGRES_USER: openstaffing
      POSTGRES_PASSWORD: openstaffing
      POSTGRES_DB: openstaffing
    ports:
      - "5432:5432"
    volumes:
      - openstaffing-db:/var/lib/postgresql/data
      - ./packages/db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openstaffing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openstaffing-db:
